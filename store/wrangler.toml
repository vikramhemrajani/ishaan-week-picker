# Cloudflare Worker that stores the family week plan and topic progress.
# The id below is not a secret. store/deploy.sh replaces the placeholder
# after `wrangler kv namespace create PLANS`.
# Week writes do not use a client secret.
name = "ishaan-week-picker-store"
main = "src/index.js"
compatibility_date = "2026-11-23"
workers_dev = true

[[kv_namespaces]]
binding = "PLANS"
id = "c0a719786bc3455cab2966f3858eac3b"
